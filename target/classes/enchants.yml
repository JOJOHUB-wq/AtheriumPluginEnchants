# --- ЗАЧАРУВАННЯ ДЛЯ ІНСТРУМЕНТІВ ---

blast_mining:
  enabled: true
  display_name: "&#f89d57Бульдозер"
  book_display_name: "&6Книга: Бульдозер"
  description:
    - "&fЛомає блоки в області 3x3."
    - "&7(На Рівні II: 3x3x3)"
  rarity: "LEGENDARY"
  max_level: 2
  conflicts: [ "timber", "silk_touch" ]
  applies_to: [ PICKAXE, SHOVEL, AXE ]
  enchanting_table: { enabled: true, chance_weight: 1 }
  trigger: "BLOCK_BREAK"
  effect:
    type: "TRENCH"
    level-1: { shape: "3x1x3", cost: 1 }
    level-2: { shape: "3x3x3", cost: 1 }
    tool-targets:
      PICKAXE: [ STONE, COBBLESTONE, DEEPSLATE, NETHERRACK, END_STONE, IRON_ORE, GOLD_ORE, COPPER_ORE, DIAMOND_ORE, EMERALD_ORE, LAPIS_ORE, REDSTONE_ORE, COAL_ORE, NETHER_GOLD_ORE, NETHER_QUARTZ_ORE, ANCIENT_DEBRIS ]
      SHOVEL: [ DIRT, GRASS_BLOCK, SAND, GRAVEL, SOUL_SAND, SOUL_SOIL, CLAY ]
      AXE: [ NETHER_WART_BLOCK, WARPED_WART_BLOCK, SHROOMLIGHT, MUSHROOM_STEM ]
    effects:
      sound: { enabled: true, name: "BLOCK_STONE_BREAK", volume: 0.8, pitch: 1.5 }
      particles: { enabled: true, name: "CRIT", count: 20, offset: 1.5 }

