# --- ЗАЧАРОВАНИЯ ДЛЯ ИНСТРУМЕНТОВ ---

blast_mining:
  enabled: true
  display_name: "&#f89d57Бульдозер"
  description:
    - "&fЛомает блоки в области 3x3."
    - "&7(На Уровне II: 3x3x3)"
  rarity: "LEGENDARY"
  max_level: 2
  conflicts: [ "timber", "silk_touch" ]
  applies_to: [ PICKAXE, SHOVEL, AXE ]
  enchanting_table:
    enabled: true
    chance_weight: 1
  trigger: "BLOCK_BREAK"
  effect:
    type: "TRENCH"
    level-1:
      shape: "3x1x3" # Форма (ШxВxД)
      cost: 1 # Доп. расход прочности за каждый доп. блок
    level-2:
      shape: "3x3x3"
      cost: 1
    # Список блоков, которые можно ломать этим чаром
    tool-targets:
      PICKAXE:
        - STONE
        - COBBLESTONE
        - DEEPSLATE
        - NETHERRACK
        - END_STONE
        - IRON_ORE
        - GOLD_ORE
        - COPPER_ORE
        - DIAMOND_ORE
        - EMERALD_ORE
        - LAPIS_ORE
        - REDSTONE_ORE
        - COAL_ORE
        - NETHER_GOLD_ORE
        - NETHER_QUARTZ_ORE
        - ANCIENT_DEBRIS
      SHOVEL:
        - DIRT
        - GRASS_BLOCK
        - SAND
        - GRAVEL
        - SOUL_SAND
        - SOUL_SOIL
        - CLAY
      AXE:
        - NETHER_WART_BLOCK
        - WARPED_WART_BLOCK
        - SHROOMLIGHT
        - MUSHROOM_STEM
timber:
  enabled: true
  display_name: "&#29FF1DЛесоруб"
  description:
    - "&fСрубает все дерево."
    - "&7(На Уровне II: безлимитно)"
  rarity: "RARE"
  max_level: 2
  conflicts: [ "blast_mining" ]
  applies_to: [ AXE ]
  enchanting_table:
    enabled: true
    chance_weight: 5
  trigger: "BLOCK_BREAK"
  effect:
    type: "TIMBER"
    level-1:
      max-blocks: 40 # Макс. блоков для сруба
      animation-ticks-per-block: 2 # Анимация: 2 тика на блок
    level-2:
      max-blocks: -1 # -1 = безлимит
      animation-ticks-per-block: 1
infernal_touch:
  enabled: true
  display_name: "&#EDFF43Авто-плавка"
  description:
    - "&fАвтоматически переплавляет добытые блоки."
  rarity: "LEGENDARY"
  max_level: 1
  conflicts: [ "silk_touch" ]
  applies_to: [ PICKAXE, SHOVEL, AXE ]
  enchanting_table:
    enabled: true
    chance_weight: 2
  trigger: "BLOCK_BREAK"
  effect:
    type: "SMELT"
    effects: # Нова секція для звуків та партиклів
      sound:
        enabled: true
        name: "BLOCK_FURNACE_FIRE_CRACKLE"
        volume: 1.0
        pitch: 1.2
      particles:
        enabled: true
        name: "LAVA"
        count: 10
        offset: 0.5
telekinesis:
  enabled: true
  display_name: "&#E01DFFМагнит"
  description:
    - "&fПритягивает дроп с блоков в инвентарь."
  rarity: "EPIC"
  max_level: 1
  conflicts: []
  applies_to: [ PICKAXE, SHOVEL, AXE, SWORD ] # Добавлен меч для мобов
  enchanting_table:
    enabled: true
    chance_weight: 3
  trigger: "BLOCK_BREAK, ATTACK_ENTITY"
  effect:
    type: "TELEKINESIS"
wisdom:
  enabled: true
  display_name: "&#886464Опытный"
  description:
    - "&fУвеличивает получаемый опыт."
  rarity: "UNCOMMON"
  max_level: 3
  conflicts: []
  applies_to: [ PICKAXE, SHOVEL, AXE, SWORD ]
  enchanting_table:
    enabled: true
    chance_weight: 8
  trigger: "BLOCK_BREAK, ATTACK_ENTITY"
  effect:
    type: "EXP_MULTIPLY"
    level-1:
      multiplier: 1.5
    level-2:
      multiplier: 2.0
    level-3:
      multiplier: 2.5
bog_touch:
  enabled: true
  display_name: "&#f89d57Божье касание"
  description:
    - "&fПозволяет сломать спавнер золотой киркой."
  rarity: "LEGENDARY"
  max_level: 1
  conflicts: [ silk_touch, blast_mining, infernal_touch ]
  applies_to: [ GOLDEN_PICKAXE ]
  enchanting_table:
    enabled: false
  trigger: "BLOCK_BREAK"
  effect:
    type: "SPAWNER_BREAK"
    level-1:
      condition: "%block type% = SPAWNER"
      durability-cost: 100
pinger:
  enabled: true
  display_name: "&7Пингер"
  description:
    - "&fПредупреждает, когда предмет почти сломан."
  rarity: "COMMON"
  max_level: 1
  conflicts: []
  applies_to: [ PICKAXE, SHOVEL, AXE, SWORD, BOW, CROSSBOW, ARMOR, BOOTS ]
  enchanting_table:
    enabled: true
    chance_weight: 10
  trigger: "BLOCK_BREAK, ATTACK_ENTITY, DEFENSE_PLAYER, BOW_SHOOT"
  effect:
    type: "DURABILITY_PING"
    level-1:
      threshold: 50 # Кол-во прочности
      message: "&cВнимание! Ваш предмет в руке почти сломан!"

