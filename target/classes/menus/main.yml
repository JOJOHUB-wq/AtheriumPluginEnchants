# Предметы в меню
items:
  sword_enchants:
    display_name: "&#f89d57Зачарования для оружия"
    lore:
      - ""
      - "&fВ этом разделе находятся"
      - "&fразличные зачарования для оружия"
      - ""
      - "&#FF6600 ➥ Нажмите&#FFFFFF, чтобы перейти"
    material: NETHERITE_SWORD
    item_flags: [ HIDE_ATTRIBUTES ]
    click_actions:
      - "[AE_OPEN] weapons" # Команда для открытия меню 'weapons.yml'
  pickaxe_enchants:
    display_name: "&#f89d57Зачарования для инструментов"
    lore:
      - ""
      - "&fВ этом разделе находятся"
      - "&fразличные зачарования для инструментов"
      - ""
      - "&#FF6600 ➥ Нажмите&#FFFFFF, чтобы перейти"
    material: NETHERITE_PICKAXE
    item_flags: [ HIDE_ATTRIBUTES ]
    click_actions:
      - "[AE_OPEN] tools" # Команда для открытия меню 'tools.yml'
  armor_enchants:
    display_name: "&#f89d57Зачарования для брони"
    lore:
      - ""
      - "&fВ этом разделе находятся"
      - "&fразличные зачарования для брони"
      - ""
      - "&#FF6600 ➥ Нажмите&#FFFFFF, чтобы перейти"
    material: NETHERITE_CHESTPLATE
    item_flags: [ HIDE_ATTRIBUTES ]
    click_actions:
      - "[AE_OPEN] armor" # Команда для открытия меню 'armor.yml'
  glass:
    display_name: "&7"
    material: RED_STAINED_GLASS_PANE
  leave:
    display_name: "&cЗакрыть"
    lore:
      - "&#FF6600 ➥ Нажмите&#FFFFFF, чтобы закрыть меню"
    material: SPECTRAL_ARROW
    click_actions:
      - "[CLOSE]" # Команда для закрытия меню

