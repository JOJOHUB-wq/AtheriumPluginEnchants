# Заголовок меню, який буде відображатися гравцеві
title: "❖ Atherium | Головне Меню"
# Розмір інвентарю (має бути кратним 9)
size: 54

# Предмети в меню
items:
  sword_enchants:
    display_name: "&#f89d57Зачарования для зброї"
    lore:
      - ""
      - "&fВ цьому розділі знаходяться"
      - "&fрізноманітні зачарування для зброї"
      - ""
      - "&#FF6600 ➥ Натисніть&#FFFFFF, щоб перейти"
    material: NETHERITE_SWORD
    item_flags: [ HIDE_ATTRIBUTES ]
    click_actions:
      - "[AE_OPEN] weapons"
  pickaxe_enchants:
    display_name: "&#f89d57Зачарования для інструментів"
    lore:
      - ""
      - "&fВ цьому розділі знаходяться"
      - "&fрізноманітні зачарування для інструментів"
      - ""
      - "&#FF6600 ➥ Натисніть&#FFFFFF, щоб перейти"
    material: NETHERITE_PICKAXE
    item_flags: [ HIDE_ATTRIBUTES ]
    click_actions:
      - "[AE_OPEN] tools"
  armor_enchants:
    display_name: "&#f89d57Зачарования для броні"
    lore:
      - ""
      - "&fВ цьому розділі знаходяться"
      - "&fрізноманітні зачарування для броні"
      - ""
      - "&#FF6600 ➥ Натисніть&#FFFFFF, щоб перейти"
    material: NETHERITE_CHESTPLATE
    item_flags: [ HIDE_ATTRIBUTES ]
    click_actions:
      - "[AE_OPEN] armor"
  glass:
    display_name: "&7"
    material: RED_STAINED_GLASS_PANE
  leave:
    display_name: "&cЗакрити"
    lore:
      - "&#FF6600 ➥ Натисніть&#FFFFFF, щоб закрити меню"
    material: SPECTRAL_ARROW
    click_actions:
      - "[CLOSE]"

# Анімація появи предметів
animation:
  # Базовий тік (затримка між кроками анімації)
  base_tick: 1
  # Послідовність анімації. Формат: "тік: команда: аргументи"
  timeline:
    - "1: set: glass 0,8"
    - "2: set: glass 1,9,17"
    - "3: set: glass 36,44"
    - "4: set: glass 45,46,52,53"
    - "6: set: sword_enchants 12"
    - "7: set: pickaxe_enchants 13"
    - "8: set: armor_enchants 14"
    - "9: set: leave 49"
